  <h1>数字货币术语解释</h1>

<script src="../data/glossary.js"></script>
<script>
(function(){
  var DATA = window.GLOSSARY || [];
  var CAT_LABEL = {basic:"基础概念", trading:"交易术语", defi:"DeFi", nft:"NFT", wallet:"钱包", security:"安全", chain:"公链 / L2", common:"通用黑话"};
  var state = { q: "", cat: "all" };

  // 渲染单条卡片
  function cardHtml(item){
    return '<div class="card">'+
      '<div class="card-head">'+
        '<div><span class="term">'+esc(item.zh.term)+'</span> <span class="term-en">'+esc(item.en.term)+'</span></div>'+
        '<span class="cat">'+esc(CAT_LABEL[item.cat] || item.cat)+'</span>'+
      '</div>'+
      '<div class="def">'+esc(item.zh.def)+'</div>'+
      '<div class="ex">例：'+esc(item.zh.ex)+'</div>'+
    '</div>';
  }
  function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function render(){
    var q = state.q.trim().toLowerCase();
    var items = DATA.filter(function(it){
      if(state.cat !== "all" && it.cat !== state.cat) return false;
      if(!q) return true;
      var blob = (it.zh.term + " " + it.en.term + " " + it.key + " " + it.zh.def + " " + it.en.def).toLowerCase();
      return blob.indexOf(q) > -1;
    });
    document.getElementById("rc").textContent = "共 " + items.length + " 个术语";
    if(items.length === 0){
      document.getElementById("grid").innerHTML = '<div class="empty">没有匹配的术语。试试其他关键词。</div>';
      return;
    }
    document.getElementById("grid").innerHTML = items.map(cardHtml).join("");
  }

  document.getElementById("q").addEventListener("input", function(){ state.q = this.value; render(); });
  document.querySelectorAll("#filters .filter").forEach(function(b){
    b.addEventListener("click", function(){
      state.cat = this.getAttribute("data-cat");
      document.querySelectorAll("#filters .filter").forEach(function(x){ x.classList.remove("on"); });
      this.classList.add("on");
      render();
    });
  });

  render();
})();
</script>
