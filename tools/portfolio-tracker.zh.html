<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>持仓记账本 — 记录任意币种（无需 API Key）</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<meta name="description" content="记录任意加密货币持仓，包括小币种。自动拉取实时价格算盈亏。无需 API Key，数据只存在你的浏览器。">
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#1c2430;--sub:#5b6776;--line:#e4e8ee;--brand:#2563eb;--brand2:#0ea5a4;--up:#dc2626;--down:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
  .wrap{max-width:880px;margin:0 auto;padding:22px 18px 60px}
  header nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0 14px;margin-bottom:20px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--brand);font-size:18px;text-decoration:none}
  .logo img{height:26px;width:26px;display:block}
  nav > span > a{color:var(--sub);text-decoration:none;font-size:13.5px}
  h1{font-size:25px;margin-bottom:6px}
  .intro{color:var(--sub);margin-bottom:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}
  .coin-input{text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .btn{margin-top:14px;background:var(--brand);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .btn:hover{opacity:.92}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:14px;display:none}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:640px){.summary{grid-template-columns:1fr}}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center}
  .sum .k{font-size:12px;color:var(--sub);font-weight:600}
  .sum .v{font-size:20px;font-weight:800;margin-top:4px}
  .sum .v.up{color:var(--up)}
  .sum .v.down{color:var(--down)}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
  th,td{border:1px solid var(--line);padding:10px 12px;text-align:right}
  th{background:#f1f5f9;font-weight:600;white-space:nowrap;text-align:right}
  th:first-child,td:first-child{text-align:left}
  .up{color:var(--up);font-weight:700}
  .down{color:var(--down);font-weight:700}
  .del{color:var(--sub);cursor:pointer;text-decoration:none;font-size:13px}
  .del:hover{color:var(--bad)}
  .empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px}
  .try{color:var(--brand);cursor:pointer;font-weight:600;text-decoration:none}
  .try:hover{text-decoration:underline}
  .scroll{overflow-x:auto}
  .refresh{margin-top:12px;text-align:right}
  .refresh a{color:var(--brand);cursor:pointer;font-size:13px;text-decoration:none}
  .foot{color:var(--sub);font-size:12px;margin-top:22px;text-align:center;line-height:1.7}
  .foot a{color:var(--sub);text-decoration:none}
  .foot a:hover{text-decoration:underline}
.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{color:var(--sub);text-decoration:none;font-size:13.5px;white-space:nowrap}.nav a:hover{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <header><nav><a class="logo" href="/zh/" aria-label="FeeEye home"><img src="/assets/logo.svg" alt="FeeEye" width="26" height="26">FeeEye</a><span class="nav"><a href="/zh/">工具</a><a href="/zh/exchanges/kucoin.html">交易所</a><a href="/zh/coins.html">币种</a><a href="/zh/compare/kucoin-vs-bybit.html">对比</a><a href="/zh/tools/glossary.zh.html">术语</a></span><span><a href="portfolio-tracker.html">English</a></span></nav></header>

  <h1>持仓记账本</h1>
  <p class="intro">记录<strong>任意</strong>币种持仓——包括小币种。自动拉取实时价格算盈亏。<strong>无需 API Key。</strong>数据只存在你的浏览器里。</p>

  <div class="panel">
    <div class="grid3">
      <div>
        <label for="coin">币种（symbol）</label>
        <input id="coin" class="coin-input" type="text" list="coinList" autocomplete="off" placeholder="如 BTC、PEPE、BOME" maxlength="20">
        <datalist id="coinList"></datalist>
      </div>
      <div>
        <label for="qty">数量</label>
        <input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="如 0.1">
      </div>
      <div>
        <label for="cost">平均买入价（USDT）</label>
        <input id="cost" type="number" inputmode="decimal" min="0" step="any" placeholder="如 60000">
      </div>
    </div>
    <button class="btn" id="addBtn">添加持仓</button>
    <div class="err" id="err"></div>
    <p class="hint">CoinGecko 收录的任何币种都可以，直接输入 symbol 即可。</p>
  </div>

  <div class="summary" id="summary" style="display:none"></div>

  <div class="scroll" id="tableWrap">
    <div class="empty" id="empty">还没有持仓。在上面添加你的第一笔。<br><a class="try" id="tryExample">试试示例：0.1 BTC @ $60,000 →</a></div>
    <table id="table" style="display:none"></table>
  </div>
  <div class="refresh"><a id="refreshBtn">↻ 刷新实时价格</a></div>

  <div class="foot">
    价格数据源：CoinGecko（实时）。你的持仓<b>只存在浏览器本地</b>（localStorage），绝不上传。本工具<b>不构成</b>投资建议。<br>
    <a href="/zh/">首页</a> · <a href="/zh/privacy.html">隐私政策</a> · <a href="/zh/terms.html">使用条款</a> · <a href="/zh/disclosure.html">返佣披露</a>
  </div>
</div>

<script src="../data/coin-ids.js"></script>
<script src="../data/coin-prices.js"></script>
<script>
(function(){
  var STORE = 'feeeye_holdings_v1';
  var CACHE = 'feeeye_symbol_cache_v1';
  var coinInput = document.getElementById('coin');
  var datalist = document.getElementById('coinList');
  var qty = document.getElementById('qty');
  var cost = document.getElementById('cost');
  var addBtn = document.getElementById('addBtn');
  var err = document.getElementById('err');
  var summary = document.getElementById('summary');
  var table = document.getElementById('table');
  var empty = document.getElementById('empty');
  var refreshBtn = document.getElementById('refreshBtn');
  var livePrices = {};

  var coins = Object.keys(window.COIN_PRICES || {}).map(function(sym){
    return { sym: sym, info: window.COIN_PRICES[sym] };
  }).sort(function(a,b){ return (a.info.rank||9999) - (b.info.rank||9999); });
  coins.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.sym;
    o.label = c.sym + ' — ' + (c.info.name || c.sym);
    datalist.appendChild(o);
  });

  function load(){
    try { return JSON.parse(localStorage.getItem(STORE)) || { holdings: [] }; }
    catch(e){ return { holdings: [] }; }
  }
  function save(d){ localStorage.setItem(STORE, JSON.stringify(d)); }
  function loadCache(){ try { return JSON.parse(localStorage.getItem(CACHE)) || {}; } catch(e){ return {}; } }
  function saveCache(c){ localStorage.setItem(CACHE, JSON.stringify(c)); }
  function showErr(m){ err.textContent = m; err.style.display = 'block'; }
  function hideErr(){ err.style.display = 'none'; }
  function fmt(n, forceDp){
    if (n == null || !Number.isFinite(n)) return '—';
    var abs = Math.abs(n);
    var dp = forceDp != null ? forceDp : (abs >= 1000 ? 2 : abs >= 1 ? 4 : 6);
    return Number(n).toLocaleString(undefined, { maximumFractionDigits: dp, minimumFractionDigits: 0 });
  }

  async function resolveCgId(sym){
    var local = (window.COIN_IDS && window.COIN_IDS[sym]) || (window.COIN_PRICES && window.COIN_PRICES[sym] && window.COIN_PRICES[sym].cg_id);
    if (local) return local;
    var cache = loadCache();
    if (cache[sym]) return cache[sym];
    try {
      var res = await fetch('https://api.coingecko.com/api/v3/search?query=' + encodeURIComponent(sym));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var coins = (data.coins || []).filter(function(c){ return c.symbol && c.symbol.toUpperCase() === sym; });
      if (!coins.length) coins = data.coins || [];
      if (coins.length) {
        var cg = coins[0].id;
        cache[sym] = cg;
        saveCache(cache);
        return cg;
      }
    } catch(e){ /* ignore */ }
    return null;
  }

  async function addHolding(){
    var sym = (coinInput.value || '').trim().toUpperCase();
    if (!sym) { showErr('请输入币种。'); return; }
    var q = parseFloat(qty.value);
    var c = parseFloat(cost.value);
    if (!q || q <= 0) { showErr('请输入有效的数量。'); return; }
    if (!c || c <= 0) { showErr('请输入有效的买入价。'); return; }
    hideErr();
    addBtn.disabled = true;
    addBtn.textContent = '正在查找币种…';
    var cgId = await resolveCgId(sym);
    if (!cgId) {
      showErr('找不到该币种，请确认 symbol 正确（CoinGecko 收录的币都能查）。');
      addBtn.disabled = false;
      addBtn.textContent = '添加持仓';
      return;
    }
    var d = load();
    d.holdings.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), symbol: sym, cg_id: cgId, qty: q, cost: c });
    save(d);
    coinInput.value = ''; qty.value = ''; cost.value = '';
    addBtn.disabled = false;
    addBtn.textContent = '添加持仓';
    await refresh();
  }

  function del(id){
    var d = load();
    d.holdings = d.holdings.filter(function(h){ return h.id !== id; });
    save(d);
    render();
  }

  function priceOf(h){
    if (h.cg_id && livePrices[h.cg_id] != null) return livePrices[h.cg_id];
    var info = window.COIN_PRICES && window.COIN_PRICES[h.symbol];
    return info && info.price != null ? info.price : null;
  }

  function render(){
    var d = load();
    var rows = d.holdings;
    if (!rows.length) {
      summary.style.display = 'none';
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    var totalCost = 0, totalValue = 0;
    var html = '';
    rows.forEach(function(h){
      var p = priceOf(h);
      var costVal = h.cost * h.qty;
      var value = p != null ? p * h.qty : null;
      var pnl = value != null ? value - costVal : null;
      var pnlPct = value != null && costVal > 0 ? ((value / costVal) - 1) * 100 : null;
      totalCost += costVal;
      if (value != null) totalValue += value;
      var cls = pnl == null ? '' : (pnl >= 0 ? 'up' : 'down');
      var sign = pnl == null ? '' : (pnl >= 0 ? '+' : '');
      html += '<tr>' +
        '<td><b>' + h.symbol + '</b></td>' +
        '<td>' + fmt(h.qty, 8) + '</td>' +
        '<td>' + fmt(h.cost) + '</td>' +
        '<td>' + (p != null ? fmt(p) : '—') + '</td>' +
        '<td>' + (value != null ? fmt(value) : '—') + '</td>' +
        '<td class="' + cls + '">' + (pnl != null ? sign + fmt(pnl) + '（' + sign + fmt(pnlPct, 2) + '%）' : '—') + '</td>' +
        '<td><a class="del" data-id="' + h.id + '">✕</a></td>' +
        '</tr>';
    });
    var totalPnl = totalValue - totalCost;
    var totalPnlPct = totalCost > 0 ? ((totalValue / totalCost) - 1) * 100 : 0;
    var tcls = totalPnl >= 0 ? 'up' : 'down';
    var tsign = totalPnl >= 0 ? '+' : '';
    table.innerHTML = '<thead><tr><th>币种</th><th>数量</th><th>买入价</th><th>现价</th><th>市值</th><th>盈亏</th><th></th></tr></thead><tbody>' + html + '</tbody>';
    table.style.display = 'table';
    summary.style.display = 'grid';
    summary.innerHTML =
      '<div class="sum"><div class="k">总成本</div><div class="v">' + fmt(totalCost) + ' USDT</div></div>' +
      '<div class="sum"><div class="k">当前市值</div><div class="v">' + fmt(totalValue) + ' USDT</div></div>' +
      '<div class="sum"><div class="k">盈亏</div><div class="v ' + tcls + '">' + tsign + fmt(totalPnl) + ' USDT（' + tsign + fmt(totalPnlPct, 2) + '%）</div></div>';
    table.querySelectorAll('.del').forEach(function(a){
      a.addEventListener('click', function(){ del(a.getAttribute('data-id')); });
    });
  }

  async function refresh(){
    var d = load();
    var changed = false;
    for (var i = 0; i < d.holdings.length; i++) {
      var h = d.holdings[i];
      if (!h.cg_id) {
        var cg = await resolveCgId(h.symbol);
        if (cg) { h.cg_id = cg; changed = true; }
      }
    }
    if (changed) save(d);
    var ids = [];
    var seen = {};
    d.holdings.forEach(function(h){ if (h.cg_id && !seen[h.cg_id]) { seen[h.cg_id] = 1; ids.push(h.cg_id); } });
    if (!ids.length) { render(); return; }
    try {
      var res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + ids.join(',') + '&vs_currencies=usd');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var p = await res.json();
      livePrices = p;
    } catch(e){
      livePrices = {};
    }
    render();
  }

  addBtn.addEventListener('click', addHolding);
  refreshBtn.addEventListener('click', refresh);
  var tryBtn = document.getElementById('tryExample');
  if (tryBtn) tryBtn.addEventListener('click', function(){
    coinInput.value = 'BTC'; qty.value = '0.1'; cost.value = '60000'; addHolding();
  });
  render();
  refresh();
})();
</script>
</body>
</html>
