<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>手续费计算器 — 交易/提币/入金费率对比</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<meta name="description" content="对比 7 家主流加密货币交易所的现货/合约交易费率、USDT 提币费率（多链）、入金费率（多通道）。免费、无需注册。">
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#1c2430;--sub:#5b6776;--line:#e4e8ee;--brand:#2563eb;--brand2:#0ea5a4;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  html{scrollbar-gutter:stable}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
  .wrap{max-width:880px;margin:0 auto;padding:22px 18px 60px}
  
  h1{font-size:25px;margin-bottom:6px}
  .intro{color:var(--sub);margin-bottom:18px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--brand);font-size:18px;text-decoration:none}
  .logo img{height:26px;width:26px;display:block}
  
  .tabs{display:flex;gap:8px;margin:18px 0 6px}
  .tab{padding:9px 16px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:600;color:var(--sub)}
  .seg button.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
  .btn{margin-top:16px;background:var(--brand);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .btn:hover{opacity:.92}
  table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
  th,td{border:1px solid var(--line);padding:10px 12px;text-align:left}
  th{background:#f1f5f9;font-weight:600;white-space:nowrap}
  tr.kc{background:#eef4ff}
  .cta{display:inline-block;background:var(--brand);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;min-height:36px}
  .cta.aff{border:1px solid #eab308}
  .ad{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:600;vertical-align:1px}
  .cta:hover{opacity:.9}
  .na{color:var(--bad);font-weight:600}
  .best{color:var(--ok);font-weight:700}
  .notice{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:14px 16px;margin-top:14px;font-size:14px;display:none}
  .foot{color:var(--sub);font-size:12px;margin-top:18px;text-align:center}
  .fees-note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6}
  .updated{font-size:11.5px;color:var(--sub);margin-top:8px}
.topbar{display:flex;align-items:center;gap:24px;flex-wrap:nowrap;padding:6px 0 8px;margin:2px 0 14px;border-bottom:1px solid var(--line)}.topbar .logo{display:flex;align-items:center;gap:8px;flex-shrink:0;color:var(--brand);font-weight:800;font-size:20px;text-decoration:none}.topbar .logo img{height:30px;width:30px;display:block}.nav{flex:1;display:flex;gap:14px;align-items:center;flex-wrap:nowrap;justify-content:center;line-height:1;min-height:0;height:auto}.nav a{color:#1e293b;text-decoration:none;font-size:14px;line-height:1;white-space:nowrap;border-bottom:2px solid transparent;padding-bottom:2px;display:inline-flex;align-items:center}.nav a:hover{color:var(--brand);border-bottom-color:var(--brand)}.nav a.active{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:600}.topbar>span{flex-shrink:0;padding-right:30px}.topbar>span>a{color:var(--sub);text-decoration:none;font-size:13.5px;line-height:1;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="logo" href="/zh/" aria-label="FeeEye 首页"><img src="/assets/logo.svg" alt="FeeEye" width="26" height="26">FeeEye</a>
      <nav class="nav" id="toolNav">
        <a href="/zh/tools/total-cost-calculator.zh.html" data-key="tc">现货工具</a>
        <a href="/zh/tools/futures-toolbox.zh.html" data-key="fut">合约工具</a>
        <a href="/zh/tools/exchange-comparator.zh.html" data-key="cmp">交易所对比</a>
        <a href="/zh/tools/glossary.zh.html" data-key="glo">术语</a>
        <a href="/zh/tools/token-security-checker.zh.html" data-key="sec">代币检查</a>
        <a href="/zh/tools/portfolio-tracker.zh.html" data-key="pf">持仓记账</a>
      </nav>
      <span><a href="/tools/fee-calculator.html">English</a></span>
    </div>
  </header>
  <script>(function(){var m={tc:"total-cost-calculator",fut:"futures-toolbox",cmp:"exchange-comparator",glo:"glossary",sec:"token-security-checker",pf:"portfolio-tracker"};var p=location.pathname;document.querySelectorAll("#toolNav a").forEach(function(a){var k=a.getAttribute("data-key");if(k&&p.indexOf("/"+m[k])>-1)a.classList.add("active");});})();</script>

  <h1>手续费计算器</h1>
  <p class="intro">对比主流交易所的<strong>交易/提币/入金</strong>费率——免费、无需注册。</p>



  <!-- 地区选择器 -->

  <div class="tabs">
    <div class="tab active" data-tab="trading">① 交易费率</div>
    <div class="tab" data-tab="withdrawal">② USDT 提币费率</div>
    <div class="tab" data-tab="deposit">③ 入金费率</div>
  </div>

  <!-- 交易面板 -->
  <div class="panel" id="p-trading">
    <div class="grid">
      <div>
        <label for="notional">单笔交易金额（USDT）</label>
        <input id="notional" type="number" inputmode="decimal" value="1000" min="1">
      </div>
      <div>
        <label>市场</label>
        <div class="seg" id="market">
          <button data-v="spot" class="on">现货</button>
          <button data-v="futures">合约</button>
        </div>
      </div>
      <div>
        <label>订单类型</label>
        <div class="seg" id="order">
          <button data-v="taker" class="on">吃单（Taker）</button>
          <button data-v="maker">挂单（Maker）</button>
        </div>
      </div>
      <div>
        <label for="trades">每月交易次数</label>
        <input id="trades" type="number" inputmode="decimal" value="10" min="1">
      </div>
      <div>
        <label for="months">计算周期（月）</label>
        <input id="months" type="number" inputmode="decimal" value="1" min="1">
      </div>
    </div>
    <button class="btn" id="calcTrading">计算交易费率</button>
  </div>

  <!-- 提币面板 -->
  <div class="panel" id="p-withdrawal" style="display:none">
    <div class="grid">
      <div>
        <label for="wamount">提现金额（USDT）</label>
        <input id="wamount" type="number" inputmode="decimal" value="1000" min="1">
      </div>
      <div>
        <label for="network">网络</label>
        <select id="network">
          <option>TRC20</option><option>ERC20</option><option>BSC</option>
          <option>SOL</option><option>Arbitrum</option><option>Base</option>
        </select>
      </div>
    </div>
    <button class="btn" id="calcWithdrawal">计算提币费率</button>
  </div>

  <!-- 入金面板 -->
  <div class="panel" id="p-deposit" style="display:none">
    <div class="grid">
      <div>
        <label for="damount">入金金额（USDT）</label>
        <input id="damount" type="number" inputmode="decimal" value="1000" min="1">
      </div>
      <div>
        <label for="dmethod">入金方式</label>
        <select id="dmethod"></select>
      </div>
    </div>
    <div class="updated" id="dmethod-note" style="margin-top:10px"></div>
  </div>

  <div id="result"></div>


  <div class="foot">仅供教育参考，不构成投资建议。请以各交易所官方页面核实所有费率。</div>
</div>

<script src="../data/exchanges.js"></script>
<script src="../data/coins.js"></script>
<script>
(function(){
  var state = { market:"spot", order:"taker", allowed:[], restricted:false };
  var LABEL = {
    spot:"现货", futures:"合约", taker:"吃单", maker:"挂单",
    exchange:"交易所", rate:"费率", estFee:"预计费用", months:"个月",
    lowest:"← 最低", receive:"到账", notSupported:"不支持该网络", signup:"注册",
    depositMethod:"入金方式", depositFee:"入金费率", estCost:"预计入金费", premium:"价格溢价", noMethod:"无此通道"
  };

  // 填充国家下拉
document.getElementById("upd").textContent = window.EXCHANGES.kucoin.last_updated;
  // 页签
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
      t.classList.add("active");
      var which = t.getAttribute("data-tab");
      document.getElementById("p-trading").style.display = which==="trading"?"block":"none";
      document.getElementById("p-withdrawal").style.display = which==="withdrawal"?"block":"none";
      document.getElementById("p-deposit").style.display = which==="deposit"?"block":"none";
      render();
    });
  });
  // 分段按钮
  function seg(id, key){
    document.querySelectorAll("#"+id+" button").forEach(function(b){
      b.addEventListener("click", function(){
        document.querySelectorAll("#"+id+" button").forEach(function(x){x.classList.remove("on");});
        b.classList.add("on"); state[key]=b.getAttribute("data-v"); render();
      });
    });
  }
  seg("market","market"); seg("order","order");

  // 填充入金方式下拉（合并 7 所的所有 deposit_methods.m 去重）
  var METHOD_ZH = {
    "Bank transfer":"银行转账", "Credit/Debit card":"信用卡/借记卡", "Apple Pay":"Apple Pay",
    "Google Pay":"Google Pay", "PayPal":"PayPal", "Bpay":"Bpay", "Wire transfer":"电汇", "P2P":"C2C"
  };
  function zhMethod(en){ return METHOD_ZH[en] || en; }
  var dmsel = document.getElementById("dmethod");
  window.getAllDepositMethods().forEach(function(m){
    var opt = document.createElement("option");
    opt.value = m; opt.textContent = zhMethod(m);
    dmsel.appendChild(opt);
  });
  dmsel.addEventListener("change", render);
  document.getElementById("damount").addEventListener("input", render);

  function fmt(n){ return n.toLocaleString(undefined,{maximumFractionDigits:2}); }

  function ctaCell(slug){
    // CTA 对应行内交易所：有返佣用返佣链接，否则用官网
    var ex = window.EXCHANGES[slug];
    var url = ex.affiliate_link || ex.official_url || "#";
    var rel = ex.affiliate_link ? ' rel="sponsored nofollow"' : ' rel="noopener"';
    if(ex.affiliate_link){ return '<a class="cta" href="'+url+'"'+rel+' target="_blank">'+LABEL.signup+'</a>'; }
    return '<a class="cta" href="'+url+'"'+rel+' target="_blank">'+LABEL.signup+'</a>';
  }

  function render(){
    var html = "";
    if(document.querySelector(".tab.active").getAttribute("data-tab")==="trading"){
      var notional = parseFloat(document.getElementById("notional").value)||0;
      var trades = parseFloat(document.getElementById("trades").value)||0;
      var months = parseFloat(document.getElementById("months").value)||0;
      var rows = [];
      Object.keys(window.EXCHANGES).forEach(function(slug){
        var ex = window.EXCHANGES[slug];
        var rate = ex[state.market][state.order];
        var fee = notional * rate * trades * months;
        rows.push({slug:slug, name:ex.name, fee:fee});
      });
      rows.sort(function(a,b){return a.fee-b.fee;});
      var best = rows.length?rows[0].fee:0;
      html += '<table><thead><tr><th>'+LABEL.exchange+'</th><th>'+LABEL[state.market]+' '+LABEL[state.order]+' '+LABEL.rate+'</th><th>'+LABEL.estFee+'（'+months+LABEL.months+'）</th><th></th></tr></thead><tbody>';
      rows.forEach(function(r){
        var ex = window.EXCHANGES[r.slug];
        var cls = "";
        var bestMark = (r.fee===best && best>0)?' <span class="best">'+LABEL.lowest+'</span>':"";
        html += '<tr class="'+cls+'"><td><b>'+r.name+'</b></td><td>'+(ex[state.market][state.order]*100).toFixed(3)+'%</td><td>'+fmt(r.fee)+' USDT'+bestMark+'</td><td>'+ctaCell(r.slug)+'</td></tr>';
      });
      html += '</tbody></table>';
    } else if (document.querySelector(".tab.active").getAttribute("data-tab")==="deposit") {
      var amt = parseFloat(document.getElementById("damount").value)||0;
      var method = document.getElementById("dmethod").value;
      var rows = [];
      Object.keys(window.EXCHANGES).forEach(function(slug){
        var ex = window.EXCHANGES[slug];
        var dm = (ex.deposit_methods||[]).find(function(d){ return d.m===method; });
        rows.push({slug:slug, name:ex.name, dm:dm, methodSupported: !!dm});
      });
      rows.sort(function(a,b){
        if(!a.methodSupported) return 1; if(!b.methodSupported) return -1;
        var ca = (a.dm.fee||0) + (a.dm.premium||0);
        var cb = (b.dm.fee||0) + (b.dm.premium||0);
        return ca - cb;
      });
      html += '<table><thead><tr><th>'+LABEL.exchange+'</th><th>'+zhMethod(method)+' '+LABEL.rate+'</th><th>'+LABEL.estCost+'（'+amt+' USDT）</th><th></th></tr></thead><tbody>';
      rows.forEach(function(r){
        if(!r.methodSupported){
          html += '<tr><td><b>'+r.name+'</b></td><td colspan="2" class="na">'+method+' '+LABEL.noMethod+'</td><td>'+ctaCell(r.slug)+'</td></tr>';
          return;
        }
        var fee = r.dm.fee || 0;
        var feeMax = r.dm.fee_max;
        var premium = r.dm.premium || 0;
        var rateStr = feeMax ? (fee*100).toFixed(1)+'%–'+(feeMax*100).toFixed(1)+'%' : (fee*100).toFixed(2)+'%';
        var est = amt * (fee + premium);
        var first = rows.filter(function(x){return x.methodSupported;})[0];
        var bestMark = (r===first)?' <span class="best">'+LABEL.lowest+'</span>':"";
        html += '<tr><td><b>'+r.name+'</b></td><td>'+rateStr+(premium>0?'<span class="updated"> +'+LABEL.premium+' '+(premium*100).toFixed(1)+'%</span>':'')+'</td><td>'+fmt(est)+' USDT'+bestMark+'</td><td>'+ctaCell(r.slug)+'</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      var amt = parseFloat(document.getElementById("wamount").value)||0;
      var net = document.getElementById("network").value;
      var rows = [];
      Object.keys(window.EXCHANGES).forEach(function(slug){
        var fee = window.getUsdtWithdrawalFee(slug, net);
        rows.push({slug:slug, name:window.EXCHANGES[slug].name, fee:fee, netSupported: fee!=null});
      });
      rows.sort(function(a,b){
        if(!a.netSupported) return 1; if(!b.netSupported) return -1; return a.fee-b.fee;
      });
      html += '<table><thead><tr><th>'+LABEL.exchange+'</th><th>'+net+' '+LABEL.rate+'</th><th>'+LABEL.receive+'</th><th></th></tr></thead><tbody>';
      rows.forEach(function(r){
        if(!r.netSupported){ html += '<tr><td><b>'+r.name+'</b></td><td colspan="2" class="na">'+net+' '+LABEL.notSupported+'</td><td>'+ctaCell(r.slug)+'</td></tr>'; return; }
        var firstSupported = rows.filter(function(x){return x.netSupported;})[0];
        var bestMark = (r===firstSupported)?' <span class="best">'+LABEL.lowest+'</span>':"";
        html += '<tr><td><b>'+r.name+'</b></td><td>'+fmt(r.fee)+' USDT'+bestMark+'</td><td>'+fmt(amt-r.fee)+' USDT</td><td>'+ctaCell(r.slug)+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    document.getElementById("result").innerHTML = html;
    document.getElementById("result").innerHTML += '<div class="fees-note">本页面只展示基础费率，交易所VIP等级提升或持有平台币后，交易费率会下降，具体请以各交易所实际展示为准。</div>';
  }

  document.getElementById("calcTrading").addEventListener("click", render);
  document.getElementById("calcWithdrawal").addEventListener("click", render);
  document.getElementById("wamount").addEventListener("change", render);
  document.getElementById("network").addEventListener("change", render);

  render();
})();
</script>
</body>
</html>
