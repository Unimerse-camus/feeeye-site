name: postdeploy-bilingual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the exact candidate
        run: node build/generate.mjs
      - name: Wait for the matching Cloudflare production release
        run: node build/ops/wait_for_deployment.mjs --base-url https://feeeye-site.pages.dev --expected-revision "$GITHUB_SHA" --attempts 36 --delay-ms 10000 --timeout-ms 10000 --out ops/automation/working/postdeploy-release.json
      - name: Verify every English and Chinese learning pair
        run: node build/ops/live_bilingual_check.mjs --base-url https://feeeye.com --fetch-base-url https://feeeye-site.pages.dev --expected-release ops/automation/working/postdeploy-release.json --all --out ops/automation/working/postdeploy-bilingual.json
      - name: Record deployment manifest and register editorial content
        run: node build/ops/content_registry.mjs --register-deployment --store receipt-ledger --dist dist
      - name: Commit registry and deployment records only
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- content-registry deployments)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add content-registry deployments
          git commit -m "record deployment and content registrations $GITHUB_SHA"
          git push origin HEAD:automation-receipts
      - name: Upload post-deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bilingual-postdeploy-${{ github.sha }}
          path: ops/automation/working/postdeploy-*.json
          if-no-files-found: warn
          retention-days: 28
