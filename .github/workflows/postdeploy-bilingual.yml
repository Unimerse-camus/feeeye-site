name: postdeploy-bilingual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build the exact candidate
        run: node build/generate.mjs
      - name: Wait for the matching Cloudflare production release
        run: node build/ops/wait_for_deployment.mjs --base-url https://feeeye-site.pages.dev --expected-revision "$GITHUB_SHA" --attempts 36 --delay-ms 10000 --timeout-ms 10000 --out ops/automation/working/postdeploy-release.json
      - name: Verify every English and Chinese learning pair
        run: node build/ops/live_bilingual_check.mjs --base-url https://feeeye.com --fetch-base-url https://feeeye-site.pages.dev --expected-release ops/automation/working/postdeploy-release.json --all --out ops/automation/working/postdeploy-bilingual.json
      - name: Upload post-deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bilingual-postdeploy-${{ github.sha }}
          path: ops/automation/working/postdeploy-*.json
          if-no-files-found: warn
          retention-days: 28
