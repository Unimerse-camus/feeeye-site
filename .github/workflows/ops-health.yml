name: ops-health

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS site origin to check
        required: true
        default: https://feeeye-site.pages.dev
  schedule:
    # 01:17 UTC = 09:17 Asia/Shanghai. Non-round minute reduces scheduler contention.
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  health:
    # Scheduled monitoring remains inert until this repository variable is explicitly enabled.
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_OPS_MONITORING == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          # Full history: ledger_freshness reads the last commit date per directory.
          path: receipt-ledger
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check public FeeEye endpoints
        env:
          # GitHub-hosted runners are blocked by the public-domain WAF. Check the
          # same immutable production deployment through its Pages origin.
          FEEEYE_HEALTH_BASE_URL: ${{ inputs.base_url || 'https://feeeye-site.pages.dev' }}
        run: node build/ops/health_check.mjs --base-url "$FEEEYE_HEALTH_BASE_URL"
      - name: Check operations ledger freshness
        run: node build/ops/ledger_freshness.mjs --store receipt-ledger
