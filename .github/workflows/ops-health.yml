name: ops-health

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS site origin to check
        required: true
        default: https://feeeye.com
  schedule:
    # 01:17 UTC = 09:17 Asia/Shanghai. Non-round minute reduces scheduler contention.
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  health:
    # Scheduled monitoring remains inert until this repository variable is explicitly enabled.
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_OPS_MONITORING == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check public FeeEye endpoints
        env:
          FEEEYE_HEALTH_BASE_URL: ${{ inputs.base_url || 'https://feeeye.com' }}
        run: node build/ops/health_check.mjs --base-url "$FEEEYE_HEALTH_BASE_URL"
