name: feedback-operations

on:
  workflow_dispatch:
  schedule:
    - cron: '7 3 * * 1'

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  operate:
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_FEEDBACK_AUTOMATION == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject legacy parallel schedules
        env:
          LEGACY_FEEDBACK: ${{ vars.FEEEYE_FEEDBACK }}
          LEGACY_REVISION: ${{ vars.FEEEYE_FEEDBACK_REVISION }}
          LEGACY_DIAGNOSTICS: ${{ vars.FEEEYE_FEEDBACK_DIAGNOSTICS }}
          LEGACY_LINKS: ${{ vars.FEEEYE_FEEDBACK_LINK_EVIDENCE }}
        run: |
          for value in "$LEGACY_FEEDBACK" "$LEGACY_REVISION" "$LEGACY_DIAGNOSTICS" "$LEGACY_LINKS"; do
            if test "$value" = enabled; then echo "Legacy feedback schedule must remain disabled"; exit 1; fi
          done
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate current bilingual inventory
        working-directory: source
        run: node build/generate.mjs
      - name: Collect allowlisted aggregate feedback
        working-directory: source
        env:
          FEEEYE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.FEEEYE_CLOUDFLARE_ANALYTICS_TOKEN }}
          FEEEYE_CLOUDFLARE_ZONE_ID: ${{ vars.FEEEYE_CLOUDFLARE_ZONE_ID }}
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/zaraz_feedback_collector.mjs --ledger-store ../receipt-ledger --out-encrypted ops/automation/working/zaraz-feedback.json.enc --summary-out ops/automation/working/zaraz-feedback-summary.json
      - name: Build encrypted content improvement queue
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/feedback_improvement_queue.mjs --input-encrypted ops/automation/working/zaraz-feedback.json.enc --out-encrypted ops/automation/working/feedback-improvement-queue.json.enc --ledger-store ../receipt-ledger
      - name: Build encrypted feedback revision plan
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/feedback_revision_planner.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/feedback-revision-plan.json.enc
      - name: Build encrypted content diagnostics
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/feedback_content_diagnostics.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/feedback-content-diagnostics.json.enc
      - name: Collect registered official link evidence when required
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/feedback_link_evidence.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/feedback-link-evidence.json.enc
      - name: Commit complete encrypted feedback cycle
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- feedback)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add feedback
          git commit -m "record complete feedback cycle $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload safe summary and encrypted cycle records
        uses: actions/upload-artifact@v7
        with:
          name: feedback-operations-${{ github.sha }}-${{ github.run_id }}
          path: |
            source/ops/automation/working/zaraz-feedback-summary.json
            source/ops/automation/working/feedback-improvement-queue.json.enc
            source/ops/automation/working/feedback-revision-plan.json.enc
            source/ops/automation/working/feedback-content-diagnostics.json.enc
            source/ops/automation/working/feedback-link-evidence.json.enc
          if-no-files-found: error
          retention-days: 30
