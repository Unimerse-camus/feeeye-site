name: cross-channel-analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 1'

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_CROSS_CHANNEL_ANALYSIS == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate canonical inventory
        working-directory: source
        run: node build/generate.mjs
      - name: Build encrypted cross-channel analysis
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/cross_channel_analysis.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/cross-channel-analysis.json.enc
      - name: Commit encrypted analysis only
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- cross-channel)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add cross-channel
          git commit -m "record cross-channel analysis $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload encrypted analysis
        uses: actions/upload-artifact@v7
        with:
          name: cross-channel-analysis-${{ github.sha }}-${{ github.run_id }}
          path: source/ops/automation/working/cross-channel-analysis.json.enc
          if-no-files-found: error
          retention-days: 30
