# 每日刷新 CoinGecko 币种数据（真实上币覆盖）
# 运行后 push data/coins.json → Cloudflare Pages 自动重新构建部署
name: refresh-coin-data

on:
  push:
    branches:
      - main
    # CI 自己 push 的是 data/** 文件，忽略避免无限循环；其余代码变更都会触发
    paths-ignore:
      - 'data/**'
      - 'dist/**'
  schedule:
    # UTC 16:00 = 北京时间 00:00，每天一次
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # 支持手动触发：Actions 页 → Run workflow

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --top 150：≤150 才抓逐币 tickers（真实覆盖）；250 会退回启发式
      # 收录策略 = 市值 Top150 ∪ /search/trending（自动捕获新热门币）∪ HOT_COINS 兜底
      # COINGECKO_API_KEY：仓库 Secret（Demo key），大幅降低 429 限流
      - name: Fetch CoinGecko data (top 150 + trending + hotlist)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node build/fetch_coins.mjs --top 150

      # 自动校准交易所「快变」元数据：币种数 / 24h 交易量 / 信任分
      # 只改 EXCHANGE_COMPARE 的 coins/volume/trust 三个字段，绝不覆盖人工核实的
      # reserve/cold/licenses/security/incident 等编辑字段
      - name: Fetch exchange meta (coins/volume/trust)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node build/fetch_exchange_meta.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coins.json data/exchanges.js
          if git diff --cached --quiet; then
            echo "::notice::data unchanged, nothing to push"
          else
            git commit -m "chore: refresh CoinGecko data ($(date -u +%Y-%m-%d))"
            # 同步远程（防 non-fast-forward：CI 跑 fetch 期间用户/AI 可能 push 新代码）
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict — remote has diverged, manual intervention needed"
              git status
              exit 1
            fi
            git push origin main
          fi
