# 每日刷新 CoinGecko 币种数据（真实上币覆盖）
# 运行后 push data/coins.json → Cloudflare Pages 自动重新构建部署
name: refresh-coin-data

on:
  schedule:
    # UTC 16:00 = 北京时间 00:00，每天一次
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # 支持手动触发：Actions 页 → Run workflow

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # --top 150：≤150 才抓逐币 tickers（真实覆盖）；250 会退回启发式
      # 收录策略 = 市值 Top150 ∪ /search/trending（自动捕获新热门币）∪ HOT_COINS 兜底
      # COINGECKO_API_KEY：仓库 Secret（付费 Pro key，pro-api 域名），大幅降低 429 限流
      - name: Fetch CoinGecko data (top 150 + trending + hotlist)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node build/fetch_coins.mjs --top 150

      # 自动校准交易所「快变」元数据：币种数 / 24h 交易量 / 信任分
      # 只改 EXCHANGE_COMPARE 的 coins/volume/trust 三个字段，绝不覆盖人工核实的
      # reserve/cold/licenses/security/incident 等编辑字段
      - name: Fetch exchange meta (coins/volume/trust)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node build/fetch_exchange_meta.mjs

      - name: Validate candidate data before committing
        run: node build/validate_local.mjs

      - name: Commit candidate branch if changed
        id: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coins.json data/exchanges.js
          if git diff --cached --quiet; then
            echo "::notice::data unchanged, nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # Learn the current dedicated-branch tip so force-with-lease fails closed on an unexpected concurrent update.
            git fetch origin refs/heads/automation/refresh-market-data:refs/remotes/origin/automation/refresh-market-data || true
            git switch -c automation/refresh-market-data
            git commit -m "chore: refresh CoinGecko data ($(date -u +%Y-%m-%d))"
            # Validate the exact committed tree; never push data directly to production main.
            node build/validate_local.mjs
            git push --force-with-lease origin automation/refresh-market-data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update review PR
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view automation/refresh-market-data --json number >/dev/null 2>&1; then
            gh pr edit automation/refresh-market-data --title "chore: refresh market data" --body "Automated CoinGecko candidate. Review source dates and required checks before merge."
          else
            gh pr create --base main --head automation/refresh-market-data --title "chore: refresh market data" --body "Automated CoinGecko candidate. Review source dates and required checks before merge."
          fi
