name: feedback-content-diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_FEEDBACK_DIAGNOSTICS == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build encrypted content diagnostics
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/feedback_content_diagnostics.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/feedback-content-diagnostics.json.enc
      - name: Commit encrypted diagnostic record only
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- feedback/diagnostics)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add feedback/diagnostics
          git commit -m "record feedback content diagnostics $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload encrypted diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: feedback-content-diagnostics-${{ github.sha }}-${{ github.run_id }}
          path: source/ops/automation/working/feedback-content-diagnostics.json.enc
          if-no-files-found: error
          retention-days: 30
