name: feedback-revision-planner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_FEEDBACK_REVISION == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate current bilingual inventory
        working-directory: source
        run: node build/generate.mjs
      - name: Build encrypted feedback revision plan
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/feedback_revision_planner.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/feedback-revision-plan.json.enc
      - name: Commit encrypted planning records only
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- feedback/improvements feedback/revision-plans)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add feedback/improvements feedback/revision-plans
          git commit -m "record feedback revision plan $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload encrypted revision plan
        uses: actions/upload-artifact@v7
        with:
          name: feedback-revision-plan-${{ github.sha }}-${{ github.run_id }}
          path: source/ops/automation/working/feedback-revision-plan.json.enc
          if-no-files-found: error
          retention-days: 30
