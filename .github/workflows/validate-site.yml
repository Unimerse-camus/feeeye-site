name: validate-site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Audit exchange data contract
        run: node build/audit_exchange_data.mjs
      - name: Test withdrawal quote models
        run: node build/test_exchange_quotes.mjs
      - name: Generate all static pages
        run: node build/generate.mjs
      - name: Validate IndexNow payload
        run: node build/submit_indexnow.mjs
      - name: Test privacy-minimal analytics contract
        run: node build/test_analytics_contract.mjs
      - name: Test frozen benchmark and local-only content packs
        run: node build/ops/test_operations.mjs
      - name: Test source review and promotion hold
        run: node build/ops/test_source_review.mjs
      - name: Test brand launch drafts
        run: node build/ops/test_launch_campaign.mjs
      - name: Test approval, deployment, health, and reporting workflow
        run: node build/ops/test_workflow_phase3.mjs
      - name: Test secret-safe X connection checker offline
        run: node build/ops/test_x_connection_check.mjs
      - name: Test fail-closed X publishing executor offline
        run: node build/ops/test_x_publish_executor.mjs
      - name: Test X preflight and append-only receipts offline
        run: node build/ops/test_x_preflight_receipts.mjs
      - name: Test disabled X live-trial workflow offline
        run: node build/ops/test_x_live_trial_workflow.mjs
      - name: Test aggregate X metrics collector offline
        run: node build/ops/test_x_metrics_collector.mjs
      - name: Test non-publishing X metrics analysis offline
        run: node build/ops/test_x_metrics_analysis.mjs
      - name: Test page-only GSC signal bridge offline
        run: node build/ops/test_gsc_page_signals.mjs
      - name: Test authenticated encryption for private operations data
        run: node build/ops/test_private_data_crypto.mjs
      - name: Reject broken generated comparison values
        run: |
          if grep -R -E ">undefined<|>NaN<|null×" dist/compare dist/zh/compare; then
            echo "Invalid value found in generated comparison pages"
            exit 1
          fi
