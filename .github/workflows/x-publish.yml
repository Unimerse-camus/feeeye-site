name: x-publish

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Frozen campaign text post to publish (see docs/x-publish-authorization-2026-10-21.md)
        required: true
        type: choice
        options:
          - cost-en
          - cost-zh
          - transfer-zh
      confirmation:
        description: Type PUBLISH_<POST-ID>_ONCE, e.g. PUBLISH_COST-EN_ONCE
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirmation == format('PUBLISH_{0}_ONCE', inputs.post_id) && vars.FEEEYE_X_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact main source
        uses: actions/checkout@v7
        with:
          path: source
      - name: Check out append-only receipt ledger before any X access
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate source and generate exact build
        working-directory: source
        run: node build/validate_local.mjs
      - name: Wait for exact deployed release
        working-directory: source
        run: node build/ops/wait_for_deployment.mjs --base-url https://feeeye-site.pages.dev --expected-revision "$GITHUB_SHA" --attempts 36 --delay-ms 10000 --timeout-ms 10000 --out ops/automation/working/x-publish-release.json
      - name: Verify all bilingual pages
        working-directory: source
        run: node build/ops/live_bilingual_check.mjs --base-url https://feeeye.com --fetch-base-url https://feeeye-site.pages.dev --expected-release ops/automation/working/x-publish-release.json --all --out ops/automation/working/x-publish-bilingual.json
      - name: Build the one-post request with no scheduling delay
        working-directory: source
        run: node build/ops/x_request_from_campaign.mjs --post-id "$POST_ID" --lead-minutes 0 --policy ops/automation/x-publish-policy.json --verification ops/automation/working/x-publish-release.json --bilingual-verification ops/automation/working/x-publish-bilingual.json --out ops/automation/working/x-request.json
        env:
          POST_ID: ${{ inputs.post_id }}
      - name: Stop if an immutable receipt already exists
        id: receipt
        working-directory: source
        run: node build/ops/x_receipt_store.mjs --lookup --store ../receipt-ledger --request ops/automation/working/x-request.json --github-output "$GITHUB_OUTPUT"
      - name: Publish exactly one root post through the official X API
        if: steps.receipt.outputs.exists != 'true'
        working-directory: source
        env:
          FEEEYE_X_CONSUMER_KEY: ${{ secrets.FEEEYE_X_CONSUMER_KEY }}
          FEEEYE_X_CONSUMER_SECRET: ${{ secrets.FEEEYE_X_CONSUMER_SECRET }}
          FEEEYE_X_ACCESS_TOKEN: ${{ secrets.FEEEYE_X_ACCESS_TOKEN }}
          FEEEYE_X_ACCESS_TOKEN_SECRET: ${{ secrets.FEEEYE_X_ACCESS_TOKEN_SECRET }}
          FEEEYE_X_PUBLISHING_ENABLED: ${{ vars.FEEEYE_X_PUBLISH }}
        run: node build/ops/x_publish_executor.mjs --request ops/automation/working/x-request.json --policy ops/automation/x-publish-policy.json --execute --out ops/automation/working/x-receipt.json
      - name: Record immutable receipt
        if: steps.receipt.outputs.exists != 'true'
        working-directory: source
        run: node build/ops/x_receipt_store.mjs --store ../receipt-ledger --request ops/automation/working/x-request.json --receipt ops/automation/working/x-receipt.json
      - name: Commit receipt only to the non-deployment ledger branch
        if: steps.receipt.outputs.exists != 'true'
        working-directory: receipt-ledger
        run: |
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add x
          git commit -m "record X receipt $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload bounded publish evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x-publish-${{ inputs.post_id }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            source/ops/automation/working/x-publish-release.json
            source/ops/automation/working/x-publish-bilingual.json
            source/ops/automation/working/x-request.json
            source/ops/automation/working/x-receipt.json
          if-no-files-found: warn
          retention-days: 30
