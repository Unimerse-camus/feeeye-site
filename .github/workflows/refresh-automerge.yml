name: refresh-automerge

on:
  workflow_run:
    workflows: [refresh-coin-data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-automerge
  cancel-in-progress: false

jobs:
  automerge:
    # Fail-closed: only a successful refresh run (or a manual supervised dispatch) proceeds.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Find the open refresh review PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --head automation/refresh-market-data --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "No open refresh PR (data unchanged); nothing to merge." 
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Fail closed unless the PR touches only the three authorized data files
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ steps.pr.outputs.number }}" --name-only | sort > /tmp/pr-files
          echo "PR ${{ steps.pr.outputs.number }} files:"; cat /tmp/pr-files
          printf '%s\n' data/coin-url-registry.json data/coins.json data/exchanges.js | sort > /tmp/allowed
          if [ ! -s /tmp/pr-files ]; then
            echo "::error::Refresh PR has an empty diff; refusing to merge."
            exit 1
          fi
          if [ -n "$(comm -23 /tmp/pr-files /tmp/allowed)" ]; then
            echo "::error::Refresh PR contains files outside the authorized data whitelist; leaving it for human review."
            comm -23 /tmp/pr-files /tmp/allowed
            exit 1
          fi
      - name: Approve the pending validate run so the required check can run
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow validate-site --branch automation/refresh-market-data --status action_required --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            echo "Approving pending validate run $RUN_ID"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/approve"
          else
            echo "No validate run awaiting approval."
          fi
      - name: Wait for the required validate check to pass
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            RUN_ID=$(gh run list --workflow validate-site --branch automation/refresh-market-data --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status == "completed") | .databaseId')
            if [ -n "$RUN_ID" ]; then
              gh run view "$RUN_ID" --json conclusion --jq '"validate conclusion: " + .conclusion'
              gh run view "$RUN_ID" --json conclusion --jq 'if .conclusion == "success" then "ok" else "failed" end' | grep -q '^ok$' || exit 1
              exit 0
            fi
            sleep 45
          done
          echo "::error::validate did not complete in time; leaving the PR for human review."
          exit 1
      - name: Merge the review PR
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --merge
          echo "Refresh PR ${{ steps.pr.outputs.number }} merged."
