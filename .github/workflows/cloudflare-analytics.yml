name: cloudflare-analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 1'

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.FEEEYE_CLOUDFLARE_ANALYTICS == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out encrypted operations ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Collect completed-day aggregate analytics
        working-directory: source
        env:
          FEEEYE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.FEEEYE_CLOUDFLARE_ANALYTICS_TOKEN }}
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/cloudflare_analytics_collector.mjs --ledger-store ../receipt-ledger --summary-out ops/automation/working/cloudflare-analytics-summary.json
      - name: Commit encrypted aggregate snapshot only
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- analytics/cloudflare)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add analytics/cloudflare
          git commit -m "record Cloudflare analytics $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload non-sensitive summary
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-analytics-summary-${{ github.sha }}-${{ github.run_id }}
          path: source/ops/automation/working/cloudflare-analytics-summary.json
          if-no-files-found: error
          retention-days: 30
