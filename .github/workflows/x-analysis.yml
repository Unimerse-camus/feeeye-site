name: x-analysis

on:
  workflow_dispatch:
  workflow_run:
    workflows: [x-metrics]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: x-receipt-ledger
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.FEEEYE_X_ANALYSIS == 'enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out aggregate receipt ledger
        uses: actions/checkout@v7
        with:
          ref: automation-receipts
          path: receipt-ledger
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate deterministic non-publishing analysis
        working-directory: source
        env:
          FEEEYE_OPS_DATA_KEY: ${{ secrets.FEEEYE_OPS_DATA_KEY }}
        run: node build/ops/x_metrics_analysis.mjs --store ../receipt-ledger --ledger-store ../receipt-ledger --out ops/automation/working/x-analysis-report.json.enc
      - name: Commit new analysis only to the receipt ledger
        working-directory: receipt-ledger
        run: |
          if test -z "$(git status --porcelain -- x-analysis)"; then exit 0; fi
          git config user.name feeeye-automation
          git config user.email 272079875+Unimerse-camus@users.noreply.github.com
          git add x-analysis
          git commit -m "record X analysis $GITHUB_RUN_ID"
          git push origin HEAD:automation-receipts
      - name: Upload aggregate analysis report
        uses: actions/upload-artifact@v7
        with:
          name: x-analysis-${{ github.sha }}-${{ github.run_id }}
          path: source/ops/automation/working/x-analysis-report.json.enc
          if-no-files-found: error
          retention-days: 30
